name: Update README timestamp

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update README
        run: |
          timestamp="Last updated on $(date -u '+%Y-%m-%d %H:%M:%S')"
          sed -i '1{/^Last updated on [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\} [0-9]\{2\}:[0-9]\{2\}:[0-9]\{2\}$/d;}' README.md
          printf '%s\n' "$timestamp" | cat - README.md > README.md.tmp
          mv README.md.tmp README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: update README timestamp"
          git push
